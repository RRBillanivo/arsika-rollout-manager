# Nginx site for the Arsika Rollout Manager dashboard on a server without a panel (Debian/Ubuntu paths).
#   1) Copy to /etc/nginx/sites-available/rollout.conf, adjust server_name, the certificate and the PHP-FPM socket
#   2) ln -s ../sites-available/rollout.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# The dashboard controls your servers: serve it over HTTPS only (Let's Encrypt: certbot --nginx), and consider
# limiting it to your own network or a VPN (allow/deny below).
# aaPanel users: use aapanel.conf instead.

server {
    listen 80;
    listen [::]:80;
    server_name rollout.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                   # nginx older than 1.25.1: remove this line, write "listen 443 ssl http2;"
    server_name rollout.example.com;

    ssl_certificate     /etc/letsencrypt/live/rollout.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rollout.example.com/privkey.pem;

    root /var/www/rollout/public;               # the public/ folder of the dashboard
    index index.html;
    client_max_body_size 2m;

    # allow 192.168.1.0/24;                     # optional: only your network / VPN
    # deny all;

    # single-page app shell and static assets: always revalidated, so updates reach the browser at once;
    # the dashboard must never be shown inside a frame of another site
    location = / {
        try_files /index.html =404;
        expires epoch;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires epoch;
    }

    # JSON API and the one-time setup page (exists only until the administrator password is set) -> PHP
    location ^~ /api/ {
        rewrite ^ /index.php last;
    }
    location = /install/ {
        rewrite ^ /install/index.php last;
    }
    location ~ ^/(index\.php|install/index\.php)$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;       # your PHP version: ls /run/php/
    }

    # nothing else is served (no .env, no source files)
    location / {
        return 404;
    }
}
