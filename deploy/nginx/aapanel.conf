# Nginx rules for the Arsika Rollout Manager dashboard.
#   aaPanel: Website > site > URL rewrite > paste this file > Save.
#   Plain Nginx: put these lines inside the site's server { } block.
# The site's root must be the public/ folder (aaPanel: Website > site > Site directory > Running directory = /public).

# single-page app shell and static assets: always revalidated, so updates reach the browser at once;
# the dashboard must never be shown inside a frame of another site
location = / {
    try_files /index.html =404;
    expires epoch;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /assets/ {
    try_files $uri =404;
    expires epoch;
}

# JSON API -> front controller (public/index.php)
location ^~ /api/ {
    try_files $uri /index.php$is_args$args;
}
